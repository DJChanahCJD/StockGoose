name: Release Android APK

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            i686-linux-android,
            x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > src-tauri/release.keystore

      - name: Create keystore.properties
        run: |
          cat > src-tauri/gen/android/app/keystore.properties << 'EOF'
          storeFile=../../../release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=upload
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF

      - name: Build Android APK
        run: npx tauri android build --apk

      - name: List APK outputs
        run: find src-tauri/gen/android -name "*.apk" 2>/dev/null || echo "No APK files found"

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: true
